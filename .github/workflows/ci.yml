# GitHub Actions CI/CD Workflow

name: Iris ML API - CI Pipeline

# Trigger workflow on push and pull requests
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Repository permissions
permissions:
  contents: read
  packages: write

jobs:

  # JOB 1: Run API Tests
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated tests
      - name: Run automated tests
        run: python -m pytest -v


  # JOB 2: Build and Publish Docker Image
  build:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    # Publish only on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Generate Docker metadata
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}