#Github action workflow
#Github automatically looks for workflow file inside .github/workflows
name: Iris ML API - CI Pipeline

#define when Github should run this workflow
on:
    #Run CI whenever code is pushed to the main branch
    push:
        branches:
            - main
        #Also validate proposed changes before they are merged
    pull_request:
        branches:
            - main
#permission are restricted to reading repo content only
permissions:
    contents: read

#define the job that make up the pipeline
jobs:
    test-and-build:
        #Github provides a fresh Ubuntu VM for this job
        runs-on: Ubuntu-latest
        #Steps
        steps:
            #step-1 Download the repo content to the runner
            - name: Check out repository
              uses: actions/checkout@v4

            #Step-2 Install python on runner
            - name: Install Python on runner
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
            # Step-3 install the dependencies needed to run the tests
            - name: Install Python Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            #step-4 Execute the automated tests
            - name: Run automated tests
              run: python -m pytest -v
            #step-5 Build image only after tests have passes
            - name: Build Docker Image
              run: docker build -t iris-ml-api:${{github.sha}}.
